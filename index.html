<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTC Texture Decoder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        :root {
            --bg: #040d1f;
            --card-bg: #071932;
            --accent: #4a78c2;
            --green: #00e676;
            --green-dark: #00c853;
            --red: #ff5252;
            --red-dark: #d50000;
            --text: #e0e8f2;
            --muted: #9cb8d6;
            --radius: 16px;
            --border: rgba(255, 255, 255, 0.09);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Cairo', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 10px;
            overflow-x: hidden;
        }

        .header-container { text-align: center; margin-bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        .main-title {
            font-size: clamp(1.6rem, 6vw, 2.8rem); font-weight: 900; margin-bottom: 5px;
            background: linear-gradient(to right, #e0e8f2, var(--accent), #e0e8f2);
            background-size: 200% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; text-transform: uppercase;
            letter-spacing: 2px; animation: titleShine 3s linear infinite;
        }
        @keyframes titleShine { to { background-position: 200% center; } }
        
        .sub-title {
            font-size: 0.85rem; font-weight: 700; color: #FFD700; letter-spacing: 1px;
            animation: glowEffect 1.5s ease-in-out infinite alternate; text-transform: uppercase;
            padding: 5px; margin: 0 auto; display: inline-block;
        }
        @keyframes glowEffect {
            from { text-shadow: 0 0 5px #FFD700, 0 0 10px #FFD700; }
            to { text-shadow: 0 0 15px #FFD700, 0 0 25px #FF8C00; }
        }

        .fit-container { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; }
        .fit-text { white-space: nowrap; display: inline-block; transform-origin: center; }

        .layout-container {
            display: flex; gap: 20px; max-width: 1100px; width: 100%; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
        }

        .card {
            background: linear-gradient(145deg, var(--card-bg), #051329);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: clamp(15px, 4vw, 30px); 
            width: 100%; max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; flex: 1 1 400px;
        }

        .card.large { max-width: 1100px; flex: 1 1 100%; }

        .card-title {
            font-size: 1.2rem; font-weight: 800; color: var(--muted);
            border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px;
            text-transform: uppercase;
        }

        .login-toggle {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-bottom: 20px; font-weight: 700; color: var(--muted); text-transform: uppercase;
        }
        .toggle-label { transition: all 0.3s; padding: 5px; }
        .active-mode { color: #fff; text-shadow: 0 0 12px rgba(255,255,255,0.6); }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--accent); transition: .4s; border-radius: 34px; border: 1px solid var(--border);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            inset-inline-start: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #e67e22; border-color: #e67e22; }
        input:checked + .slider:before { transform: translateX(24px); }

        .input-group { margin-bottom: 20px; text-align: start; width: 100%; }
        .input-group label {
            display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; color: var(--muted);
            text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px;
        }
        .input-group input[type="text"] {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4); color: #fff; outline: none; font-size: 0.95rem;
            transition: all 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(74, 120, 194, 0.2); }

        input[type="file"] { display: none; }
        .file-upload-wrapper {
            display: flex; align-items: center; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border); border-radius: 12px; padding: 14px 15px;
            transition: border-color 0.3s; position: relative; margin-bottom: 20px;
        }
        .file-upload-wrapper:hover { border-color: var(--accent); }
        .btn-choose-file {
            background: rgba(74, 120, 194, 0.1); color: var(--accent); border: 1.5px solid var(--accent);
            padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; 
            transition: all 0.3s; white-space: nowrap; flex-shrink: 0;
        }
        .file-name-display {
            margin-inline-start: 15px; color: var(--muted); font-size: 0.85rem; font-weight: 500;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex-grow: 1;
        }

        .btn-main {
            width: 100%; padding: 15px 12px; border-radius: 12px; border: none;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden;
            font-size: 0.95rem; white-space: nowrap; margin-top: auto;
        }
        
        .btn-green { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #000; }
        .btn-red { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; }
        .btn-accent { background: linear-gradient(135deg, var(--accent), #2b5797); color: #fff; }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; }
        .btn-main:hover { transform: translateY(-3px); }
        
        .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--accent), var(--green)); transition: width 0.3s ease; width: 0%; }

        .instruction-box {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px; padding: 12px; margin-bottom: 20px; width: 100%; text-align: center;
        }
        .instruction-text { color: #FFD700; font-size: 0.9rem; font-weight: 700; }
        
        .warning-box {
            background: rgba(213, 0, 0, 0.15); border: 1px solid rgba(255, 82, 82, 0.5);
            border-radius: 12px; padding: 12px; margin-bottom: 20px; width: 100%; text-align: center;
        }
        .warning-text { color: var(--red); font-size: 0.9rem; font-weight: 800; }

        .success-box {
            background: rgba(0, 230, 118, 0.15); border: 1px solid rgba(0, 230, 118, 0.5);
            border-radius: 12px; padding: 12px; margin-bottom: 20px; width: 100%; text-align: center;
        }
        .success-text { color: var(--green); font-size: 0.9rem; font-weight: 800; }

        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; }
        
        .item-wrapper {
            display: flex; flex-direction: column; background: #0c121e; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06); padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            gap: 8px; align-items: center; text-align: center;
        }

        .item-box-top {
            aspect-ratio: 1/1; position: relative; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
            display: flex; align-items: center; justify-content: center; width: 100%;
            border-radius: 10px; overflow: hidden; border: 1px dashed var(--border);
        }
        
        .card-icon { width: 85%; height: 85%; object-fit: contain; z-index: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }

        .item-id-bottom {
            background: transparent; width: 100%; padding: 4px 2px;
            display: flex; flex-direction: column; overflow: hidden; align-items: center;
        }
        .item-id-bottom small { color: var(--muted); font-size: 0.7rem; }

        .action-row { display: flex; gap: 12px; margin-bottom: 20px; width: 100%; flex-wrap: wrap; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="main-title">ASTC Texture Decoder</h1>
        <div class="fit-container" style="max-width: 90%; font-size: 0.5rem;">
         <span class="fit-text" style="color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">ASTC Decompression Tool By KingofGames</span>
       </div>
    </div>

    <div class="layout-container">
        <div class="card">
            <div class="card-title">1. Load from FF Server</div>
            
            <div class="login-toggle">
                <span id="label-live" class="toggle-label active-mode">LIVE</span>
                <label class="switch">
                    <input type="checkbox" id="serverToggle" onchange="toggleServerMode()">
                    <span class="slider"></span>
                </label>
                <span id="label-advance" class="toggle-label">ADVANCE</span>
            </div>

            <div class="input-group">
                <label>Item ID</label>
                <input type="text" id="itemIDInput" placeholder="Enter Item ID here...">
            </div>

            <div class="progress-bar">
                <div id="urlProgress" class="progress-fill"></div>
            </div>

            <button class="btn-main btn-accent" onclick="loadFromURL()">
                <span>Download & Decode</span>
            </button>
        </div>

        <div class="card">
            <div class="card-title">2. Load from Device</div>
            
            <div class="input-group">
                <label>Select ASTC Files</label>
                <div class="file-upload-wrapper">
                    <label for="fileInput" class="btn-choose-file">Choose Files</label>
                    <span class="file-name-display" id="fileInputLabel">No file chosen</span>
                    <input type="file" id="fileInput" accept=".astc" multiple onchange="updateFileInfo(this.files)">
                </div>
            </div>

            <div class="progress-bar">
                <div id="fileProgress" class="progress-fill"></div>
            </div>

            <button class="btn-main btn-accent" onclick="loadFromFile()">
                <span>Decode Selected Files</span>
            </button>
        </div>
    </div>

    <div class="layout-container">
        <div class="card large">
            <div class="card-title">3. Results</div>
            
            <div id="statusBox" class="instruction-box">
                <span id="statusText" class="instruction-text">Ready to decode ASTC textures</span>
            </div>

            <div class="action-row">
                <button class="btn-main btn-green hidden" id="downloadPngBtn" onclick="downloadPNGs()">
                    <span>Download as PNG</span>
                </button>
                <button class="btn-main btn-green hidden" id="downloadAllBtn" onclick="downloadAllAsZip()">
                    <span>Download All as ZIP</span>
                </button>
                <button class="btn-main btn-red" onclick="clearBatchResults()">
                    <span>Clear Results</span>
                </button>
            </div>

            <div id="outputContainer" class="wishlist-grid"></div>
        </div>
    </div>

    <div style="margin-top: 20px; text-align: center; width: 100%;">
        <div class="sub-title">Made By King of Games</div>
    </div>

    <script src="astc-decode.js"></script>
    <script>
        let decodedFilesForZip = {};

        function fitText() {
            document.querySelectorAll('.fit-text').forEach(el => {
                el.style.fontSize = '';
                let parent = el.parentElement;
                let parentW = parent.clientWidth;
                if (parentW === 0) return;
                let scrollW = el.scrollWidth;
                if (scrollW > parentW) {
                    let currentSize = parseFloat(window.getComputedStyle(el).fontSize);
                    el.style.fontSize = Math.floor(currentSize * (parentW / scrollW)) + 'px';
                }
            });
        }

        window.addEventListener('resize', fitText);

        window.addEventListener('load', async () => {
            updateStatus('Initializing tool...', 'loading');
            fitText();
            try {
                await initASTCDecoder();
                updateStatus('ASTC tool ready to use!', 'success');
            } catch (error) {
                updateStatus('Initialization failed: ' + error.message, 'error');
            }
        });

        function toggleServerMode() {
            const isAdvance = document.getElementById("serverToggle").checked;
            document.getElementById("label-live").classList.toggle("active-mode", !isAdvance);
            document.getElementById("label-advance").classList.toggle("active-mode", isAdvance);
        }

        function updateStatus(message, type = '') {
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            
            statusBox.className = '';
            statusText.className = '';
            
            if (type === 'error') {
                statusBox.classList.add('warning-box');
                statusText.classList.add('warning-text');
            } else if (type === 'success') {
                statusBox.classList.add('success-box');
                statusText.classList.add('success-text');
            } else {
                statusBox.classList.add('instruction-box');
                statusText.classList.add('instruction-text');
            }
            
            statusText.textContent = message;
        }

        function updateFileInfo(files) {
            const label = document.getElementById('fileInputLabel');
            if (files.length === 1) {
                label.textContent = files[0].name;
            } else if (files.length > 1) {
                label.textContent = `${files.length} files selected`;
            } else {
                label.textContent = 'No file chosen';
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadFromFile() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            
            if (files.length === 0) {
                updateStatus('Please select ASTC files first', 'error');
                return;
            }

            updateStatus(`Processing ${files.length} file(s)...`, 'loading');
            document.getElementById('fileProgress').style.width = '50%';
            
            let successCount = 0;
            let errorCount = 0;

            for (const file of files) {
                try {
                    await decodeASTCFile(file);
                    successCount++;
                } catch (error) {
                    errorCount++;
                }
            }

            document.getElementById('fileProgress').style.width = '100%';
            updateStatus(`Processing complete: ${successCount} success, ${errorCount} failed`, successCount > 0 ? 'success' : 'error');
            setTimeout(() => { document.getElementById('fileProgress').style.width = '0%'; }, 2000);
        }

        async function loadFromURL() {
            const itemId = document.getElementById('itemIDInput').value.trim();
            const isAdvance = document.getElementById('serverToggle').checked;
            
            if (!itemId) {
                updateStatus('Please enter the Item ID', 'error');
                return;
            }

            const server = isAdvance ? 'advance' : 'live';
            const url = `https://dl.cdn.freefiremobile.com/${server}/ABHotUpdates/IconCDN/android/${itemId}_rgb.astc`;

            try {
                updateStatus('Downloading from server...', 'loading');
                document.getElementById('urlProgress').style.width = '10%';
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error("Incorrect ID or icon is not currently available on the server");
                }

                const contentLength = response.headers.get('content-length');
                let receivedLength = 0;
                
                if (contentLength) {
                    const reader = response.body.getReader();
                    const chunks = [];
                    
                    while(true) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        receivedLength += value.length;
                        document.getElementById('urlProgress').style.width = (receivedLength / contentLength * 100) + '%';
                    }
                    
                    const astcData = new Uint8Array(receivedLength);
                    let position = 0;
                    for(let chunk of chunks) {
                        astcData.set(chunk, position);
                        position += chunk.length;
                    }
                    
                    const filename = `${itemId}_rgb.astc`;
                    await processASTCData(astcData, filename);
                } else {
                    const arrayBuffer = await response.arrayBuffer();
                    document.getElementById('urlProgress').style.width = '100%';
                    const filename = `${itemId}_rgb.astc`;
                    await processASTCData(new Uint8Array(arrayBuffer), filename);
                }
                
                updateStatus('Downloaded and decoded successfully', 'success');
            } catch (error) {
                updateStatus(error.message, 'error');
            } finally {
                setTimeout(() => { document.getElementById('urlProgress').style.width = '0%'; }, 2000);
            }
        }

        async function decodeASTCFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const arrayBuffer = event.target.result;
                        const uniqueFilename = `${Date.now()}_${file.name}`;
                        await processASTCData(new Uint8Array(arrayBuffer), uniqueFilename);
                        resolve();
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsArrayBuffer(file);
            });
        }

        async function processASTCData(astcData, filename) {
            if (!wasm) {
                await initASTCDecoder();
            }
            
            const header = parseASTCHeader(astcData);
            const decodedData = decodeASTCTexture(astcData);
            const displayFilename = filename.includes('_') && !filename.endsWith('_rgb.astc') ? filename.substring(filename.indexOf('_') + 1) : filename;
            
            let targetWidth = header.width;
            let targetHeight = header.height;

            const sizeMap = {
                '9250': { w: 96, h: 150 },
                '9130': { w: 196, h: 164 }
            };

            for (const prefix in sizeMap) {
                if (displayFilename.startsWith(prefix)) {
                    targetWidth = sizeMap[prefix].w;
                    targetHeight = sizeMap[prefix].h;
                    break;
                }
            }
            
            const container = document.getElementById('outputContainer');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'item-wrapper';

            const boxTop = document.createElement('div');
            boxTop.className = 'item-box-top';

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = header.width;
            tempCanvas.height = header.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            drawToCanvas(tempCtx, decodedData, header.width, header.height);

            const newCanvas = document.createElement('canvas');
            newCanvas.width = targetWidth;
            newCanvas.height = targetHeight;
            newCanvas.className = 'card-icon';
            const newCtx = newCanvas.getContext('2d');
            
            newCtx.imageSmoothingEnabled = true;
            newCtx.imageSmoothingQuality = 'high';
            newCtx.drawImage(tempCanvas, 0, 0, targetWidth, targetHeight);

            boxTop.appendChild(newCanvas);

            const itemBottom = document.createElement('div');
            itemBottom.className = 'item-id-bottom';
            itemBottom.innerHTML = `
                <div class="fit-container" style="margin-bottom: 4px; width: 100%;">
                    <span class="fit-text" style="color: #fff; font-weight: 800; font-size: 0.85rem;">${displayFilename}</span>
                </div>
                <small>${targetWidth} × ${targetHeight}</small>
                <small>${formatFileSize(astcData.length)}</small>
            `;

            wrapper.appendChild(boxTop);
            wrapper.appendChild(itemBottom);
            container.appendChild(wrapper);
            
            decodedFilesForZip[filename] = {
                data: decodedData,
                originalWidth: header.width,
                originalHeight: header.height,
                targetWidth: targetWidth,
                targetHeight: targetHeight
            };
            
            updateDownloadButtons();
            setTimeout(fitText, 50);
        }

        function triggerCanvasDownload(fileData, pngFilename) {
            const bufferCanvas = document.createElement('canvas');
            bufferCanvas.width = fileData.originalWidth;
            bufferCanvas.height = fileData.originalHeight;
            const bufferCtx = bufferCanvas.getContext('2d');
            drawToCanvas(bufferCtx, fileData.data, fileData.originalWidth, fileData.originalHeight);

            const targetCanvas = document.createElement('canvas');
            targetCanvas.width = fileData.targetWidth;
            targetCanvas.height = fileData.targetHeight;
            const targetCtx = targetCanvas.getContext('2d');
            
            targetCtx.imageSmoothingEnabled = true;
            targetCtx.imageSmoothingQuality = 'high';
            targetCtx.drawImage(bufferCanvas, 0, 0, fileData.targetWidth, fileData.targetHeight);

            const link = document.createElement('a');
            link.download = pngFilename;
            link.href = targetCanvas.toDataURL('image/png');
            link.click();
        }

        async function downloadPNGs() {
            const files = decodedFilesForZip;
            const numFiles = Object.keys(files).length;

            if (numFiles === 0) return;

            updateStatus(`Downloading ${numFiles} images...`, 'loading');
            
            for (const filename in files) {
                const file = files[filename];
                const cleanFilename = filename.includes('_') && !filename.endsWith('_rgb.astc') ? filename.substring(filename.indexOf('_') + 1) : filename;
                const pngFilename = cleanFilename.replace(/\.astc$/i, '.png');
                triggerCanvasDownload(file, pngFilename);
                await new Promise(r => setTimeout(r, 250));
            }
            updateStatus('Download started', 'success');
        }

        async function downloadAllAsZip() {
            if (Object.keys(decodedFilesForZip).length === 0) return;

            updateStatus('Creating ZIP file...', 'loading');
            
            try {
                const zip = new JSZip();

                for (const filename in decodedFilesForZip) {
                    const file = decodedFilesForZip[filename];
                    
                    const bufferCanvas = document.createElement('canvas');
                    bufferCanvas.width = file.originalWidth;
                    bufferCanvas.height = file.originalHeight;
                    const bufferCtx = bufferCanvas.getContext('2d');
                    drawToCanvas(bufferCtx, file.data, file.originalWidth, file.originalHeight);

                    const targetCanvas = document.createElement('canvas');
                    targetCanvas.width = file.targetWidth;
                    targetCanvas.height = file.targetHeight;
                    const targetCtx = targetCanvas.getContext('2d');
                    
                    targetCtx.imageSmoothingEnabled = true;
                    targetCtx.imageSmoothingQuality = 'high';
                    targetCtx.drawImage(bufferCanvas, 0, 0, file.targetWidth, file.targetHeight);

                    const blob = await new Promise(resolve => targetCanvas.toBlob(resolve, 'image/png'));
                    
                    const cleanFilename = filename.includes('_') && !filename.endsWith('_rgb.astc') ? filename.substring(filename.indexOf('_') + 1) : filename;
                    const pngFilename = cleanFilename.replace(/\.astc$/i, '.png');
                    zip.file(pngFilename, blob);
                }

                const zipBlob = await zip.generateAsync({ type: "blob" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(zipBlob);
                link.download = 'decoded_astc_images.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                updateStatus('ZIP downloaded successfully', 'success');
            } catch (error) {
                updateStatus('Failed to create ZIP', 'error');
            }
        }
        
        function updateDownloadButtons() {
            const numFiles = Object.keys(decodedFilesForZip).length;
            const pngBtn = document.getElementById('downloadPngBtn');
            const zipBtn = document.getElementById('downloadAllBtn');

            if (numFiles === 1) {
                pngBtn.classList.remove('hidden');
                zipBtn.classList.add('hidden');
            } else if (numFiles > 1) {
                pngBtn.classList.remove('hidden');
                zipBtn.classList.remove('hidden');
            } else {
                pngBtn.classList.add('hidden');
                zipBtn.classList.add('hidden');
            }
        }

        function clearBatchResults() {
            document.getElementById('outputContainer').innerHTML = '';
            decodedFilesForZip = {};
            updateStatus('Results cleared', '');
            
            document.getElementById('downloadAllBtn').classList.add('hidden');
            document.getElementById('downloadPngBtn').classList.add('hidden');
            
            document.getElementById('fileInputLabel').textContent = 'No file chosen';
            document.getElementById('fileInput').value = '';
            document.getElementById('itemIDInput').value = '';
            
            document.getElementById('fileProgress').style.width = '0%';
            document.getElementById('urlProgress').style.width = '0%';
        }
    </script>
</body>
</html>
